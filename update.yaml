global:
  edition: ce

  hosts:
    domain: thelearning.online
    https: false

  ingress:
    provider: aws
    class: alb
    configureCertmanager: false

    annotations:
      alb.ingress.kubernetes.io/group.name: gitlab
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /users/sign_in
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/success-codes: "200,302"

  psql:
    host: my-postgres-db.c2numemeuxbl.us-east-1.rds.amazonaws.com
    port: 5432
    username: gitlab
    database: gitlabhq_production

    password:
      secret: gitlab-postgresql-password
      key: password

    ssl: null


# Disable bundled PostgreSQL
postgresql:
  install: false


# Disable nginx ingress because AWS ALB is being used
nginx-ingress:
  enabled: false


# Disable GitLab Runner
gitlab-runner:
  install: false


# Prometheus
prometheus:
  install: true


# Disable cert-manager

# Disable automatic Let's Encrypt issuer
certmanager-issuer:
  email: "muralipichika1998@gmail.com"
